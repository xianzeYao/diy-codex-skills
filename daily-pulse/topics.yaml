topics:
  - name: "AI agents"
    priority: medium
    keywords:
      - "AI agents"
      - "agent memory"
      - "agentic workflow"
      - "computer use agents"
    sources:
      - huggingface_daily_papers
      - arxiv
      - openreview
      - project_page
    min_papers: 3
    max_papers: 5
    action_threshold: "suggest a task only when the update is directly relevant to current work or learning plans"

  - name: "Robotics and embodied AI"
    priority: medium
    keywords:
      - "robotics foundation model"
      - "embodied AI"
      - "robot manipulation"
      - "vision language action model"
    sources:
      - huggingface_daily_papers
      - arxiv
      - openreview
      - project_page
    min_papers: 3
    max_papers: 5
    action_threshold: "suggest a task only for papers, code, or demos worth reading or reproducing"

  - name: "LLM / MLLM CoT"
    priority: medium
    keywords:
      - "chain-of-thought"
      - "CoT reasoning"
      - "multimodal reasoning"
      - "MLLM reasoning"
      - "test-time reasoning"
      - "reasoning trace"
      - "CoT distillation"
      - "CoT unlearning"
      - "reasoning verification"
    sources:
      - huggingface_daily_papers
      - arxiv
      - openreview
      - project_page
    min_papers: 3
    max_papers: 5
    action_threshold: "suggest a task only when the paper directly improves CoT technique understanding, LLM/MLLM reasoning evaluation, reasoning trace control, or test-time reasoning workflows"
